<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1c75bc" />
  <meta name="description" content="Discover ONDC buyer apps to buy your bus ticket." />
  <meta property="og:title" content="Bus Discover | ONDC" />
  <meta property="og:description" content="Discover ONDC buyer apps to buy your bus ticket." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <title>Bus Discover | ONDC</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #1E293B;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Layout ── */
    .app-root {
      width: 100%;
      max-width: 430px;
      height: calc(100dvh - 64px);
      background: #F4F6F9;
      border-radius: 40px;
      overflow: clip;
      box-shadow: 0 0 0 6px rgba(255,255,255,.06), 0 24px 80px rgba(0,0,0,.55);
      display: flex;
      flex-direction: column;
    }

    /* ── Navbar ── */
    .ondc-navbar {
      width: 100%;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 1px 6px rgba(0, 0, 0, .06);
      flex-shrink: 0;
      z-index: 100;
    }

    .ondc-navbar-inner {
      max-width: 580px;
      margin: 0 auto;
      height: 64px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ondc-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
    }

    .ondc-logo-img {
      height: 44px;
      width: auto;
      display: block;
    }

    .ondc-navbar-product {
      font-size: .75rem;
      font-weight: 600;
      color: #64748b;
      letter-spacing: .04em;
      text-transform: uppercase;
      border-left: 1.5px solid #e2e8f0;
      padding-left: 14px;
    }

    /* ── Hero header ── */
    .header {
      width: 100%;
      background: linear-gradient(140deg, #1c75bc 0%, #0e9cd8 60%, #00aeef 100%);
      padding: 20px 16px 20px;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-hero {
      max-width: 580px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .header-logo {
      width: 108px;
      height: 108px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bus-icon-svg {
      width: 64px;
      height: 64px;
      fill: #fff;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, .25));
    }

    .operator-logo-img {
      max-width: 200px;
      max-height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, .25));
    }

    .operator-logo-img[hidden],
    .bus-icon-svg[hidden] {
      display: none;
    }

    .header-text {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-title {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -.5px;
      color: #fff;
      line-height: 1.15;
    }

    .header-subtitle {
      font-size: .9rem;
      color: rgba(255, 255, 255, .85);
      font-weight: 400;
      line-height: 1.5;
    }

    .header-bus-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 2px auto 0;
      padding: 4px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .18);
      color: #fff;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .03em;
    }

    .header-bus-badge[hidden] {
      display: none;
    }

    /* ── Main content area ── */
    .app-content {
      flex: 1;
      /* Only this region scrolls — navbar and footer stay pinned */
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px calc(32px + env(safe-area-inset-bottom, 0px));
    }

    /* ── Seller list ── */
    .seller-list {
      list-style: none;
      padding: 10px 0;
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .seller-item a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      min-height: 56px;
      border-radius: 28px;
      text-decoration: none;
      color: #0d2137;
      font-weight: 600;
      font-size: .97rem;
      border: 1.5px solid #e8f0f8;
      background: #fafbff;
      transition: background .15s, border-color .15s, box-shadow .15s, transform .1s;
    }

    .seller-item a:hover {
      background: #eef4ff;
      border-color: #bad3f5;
      box-shadow: 0 4px 16px rgba(28, 117, 188, .13);
      transform: translateY(-1px);
    }

    .seller-item a:active {
      transform: translateY(0);
      background: #deeaff;
    }

    .seller-logo,
    .seller-logo-fallback {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      flex-shrink: 0;
      object-fit: contain;
      background: #fff;
      border: 1px solid #eef2f7;
    }

    .seller-logo-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
      color: #fff;
      background: linear-gradient(135deg, #1c75bc, #00aeef);
      border: none;
    }

    .seller-name {
      flex: 1;
      text-align: left;
    }

    .seller-arrow {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      stroke: #94a3b8;
    }

    /* ── Status messages (loading / error / empty) ── */
    .status-wrap {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 52px 24px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 2px 12px rgba(0, 70, 150, .07), 0 8px 40px rgba(0, 70, 150, .08);
      text-align: center;
    }

    .status-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }

    .status-icon.loading { background: #dce8ff; }
    .status-icon.error   { background: #fdecea; }
    .status-icon.empty   { background: #f0f2f7; }

    .status-icon svg {
      width: 32px;
      height: 32px;
    }

    .status-icon.loading svg {
      stroke: #1c75bc;
      animation: spin 1s linear infinite;
    }

    .status-icon.error svg { stroke: #d32f2f; }
    .status-icon.empty svg { stroke: #9ca3af; }

    .status-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0d2137;
    }

    .status-body {
      font-size: .88rem;
      color: #6b7280;
      line-height: 1.65;
      white-space: pre-line;
      max-width: 280px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Footer ── */
    .app-footer {
      background: #0D2137;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      flex-shrink: 0;
    }

    .app-footer-inner {
      max-width: 580px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: .73rem;
      color: rgba(255, 255, 255, .5);
      letter-spacing: .025em;
      text-align: center;
    }

    .app-footer-brand {
      color: #00aeef;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .app-footer-sep {
      color: rgba(255, 255, 255, .25);
    }

    /* ── Responsive ── */
    @media (min-width: 640px) {
      .ondc-navbar-inner { padding: 0 24px; }

      .header { padding: 48px 24px 40px; }

      .header-logo {
        width: 144px;
        height: 124px;
      }

      .bus-icon-svg {
        width: 76px;
        height: 76px;
      }

      .header-title { font-size: 1.9rem; }

      .app-content { padding: 36px 24px 48px; }
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
        background: #F4F6F9;
        display: block;
      }
      .app-root {
        max-width: 100%;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>

<body>
  <div class="app-root">

    <!-- Navbar -->
    <nav class="ondc-navbar" aria-label="ONDC">
      <div class="ondc-navbar-inner">
        <a class="ondc-logo" href="https://ondc.org" target="_blank" rel="noopener noreferrer"
          aria-label="ONDC – Open Network for Digital Commerce">
          <img src="/public/ondc-logo.svg" alt="ONDC" class="ondc-logo-img" height="34" />
        </a>
        <span class="ondc-navbar-product">Discover Buses</span>
      </div>
    </nav>

    <!-- Hero header — title filled in by JS -->
    <header class="header">
      <div class="header-hero">
        <div class="header-logo">
          <img id="operator-logo" class="operator-logo-img" src="" alt="" hidden />
          <svg id="bus-icon" class="bus-icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C7.58 2 4 2.5 4 6v9.5c0 .95.38 1.81 1 2.44V20a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h8v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-2.06c.62-.63 1-1.49 1-2.44V6c0-3.5-3.58-4-8-4zM7.5 17a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm9 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM18 11H6V6h12v5z"/>
          </svg>
        </div>
        <div class="header-text">
          <h1 class="header-title" id="page-title">Bus Ticket Sellers</h1>
          <p class="header-subtitle" id="page-subtitle">Choose an authorised app to buy your ticket</p>
          <span class="header-bus-badge" id="bus-badge" hidden></span>
        </div>
      </div>
    </header>

    <!-- Dynamic content injected here -->
    <main class="app-content" id="main-content">
      <!-- Loading state shown on first paint -->
      <div class="status-wrap">
        <div class="status-icon loading">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="9" stroke-opacity=".25" />
            <path d="M12 3a9 9 0 0 1 9 9" />
          </svg>
        </div>
        <p class="status-title">Loading buyer apps…</p>
        <p class="status-body">Hang tight, fetching available options.</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="app-footer-inner">
        <span class="app-footer-brand">Powered by ONDC Network</span>
      </div>
    </footer>

  </div>

  <script>
    var CONFIG_URL = '/public/buyers-config.json';

    var mainEl = document.getElementById('main-content');
    var titleEl = document.getElementById('page-title');
    var subtitleEl = document.getElementById('page-subtitle');
    var busBadgeEl = document.getElementById('bus-badge');
    var operatorLogoEl = document.getElementById('operator-logo');
    var busIconEl = document.getElementById('bus-icon');

    function setHeroLogo(src) {
      if (src) {
        operatorLogoEl.src = src;
        operatorLogoEl.removeAttribute('hidden');
        busIconEl.setAttribute('hidden', '');
      } else {
        operatorLogoEl.setAttribute('hidden', '');
        busIconEl.removeAttribute('hidden');
      }
    }

    var params = new URLSearchParams(location.search);
    var busNumber = (params.get('vid') || params.get('bus') || '').trim();

    // Slug from path (/katch) with ?operator= / ?buyer= fallback — case-insensitive
    var pathParts = location.pathname.replace(/^\/|\/$/g, '').split('/').filter(Boolean);
    var requestedSlug = slugify(params.get('buyer') || params.get('operator') || pathParts[pathParts.length - 1] || '');

    function slugify(s) {
      return String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    // Final link for a buyer: fill {bus_number} from the QR's vid, or use the
    // fallback URL when no vehicle id is present. Empty string = unusable.
    function resolveUrl(buyer) {
      if (!buyer.url) return '';
      if (buyer.url.indexOf('{bus_number}') === -1) return buyer.url;
      if (busNumber) return buyer.url.replace('{bus_number}', encodeURIComponent(busNumber));
      return buyer.fallbackUrl || '';
    }

    fetch(CONFIG_URL)
      .then(function (res) {
        if (!res.ok) throw new Error(res.status);
        return res.json();
      })
      .then(function (config) {
        var operatorSlugs = Object.keys(config);

        // Operator routes first: /osrtc → that operator's buyer-options page
        if (requestedSlug && operatorSlugs.indexOf(requestedSlug) !== -1) {
          renderOperator(requestedSlug, config[requestedSlug]);
          return;
        }

        // Then buyer QR routes: /katch, /oneticket … (slug field or slugified name)
        var buyerMatch = null;
        var buyerOperator = null;
        operatorSlugs.forEach(function (op) {
          (config[op].buyers || []).forEach(function (b) {
            if (!buyerMatch && requestedSlug && slugify(b.slug || b.name) === requestedSlug) {
              buyerMatch = b;
              buyerOperator = config[op];
            }
          });
        });

        if (buyerMatch) {
          renderBuyer(buyerMatch, buyerOperator);
          return;
        }

        // Root (and anything unknown) → landing page with the operator picker
        renderOperatorList(config, false);
      })
      .catch(function () {
        renderStatus('error', 'Something went wrong',
          "We couldn’t load the buyer app list.\nPlease check your connection and try again.");
      });

    // Single-buyer route: show the app and take the commuter straight to it
    function renderBuyer(buyer, operator) {
      // No vid in the URL but the buyer has a default one: redirect to the vid URL
      if (!busNumber && buyer.defaultVid) {
        location.replace(location.pathname + '?vid=' + encodeURIComponent(buyer.defaultVid));
        return;
      }

      var name = buyer.name;
      titleEl.textContent = 'Bus Tickets — ' + name;
      document.title = 'Bus Tickets — ' + name + ' | ONDC';
      if (operator && operator.displayName) {
        subtitleEl.textContent = 'Authorised ONDC buyer app for ' + operator.displayName;
      }

      if (busNumber) {
        busBadgeEl.textContent = 'Bus No. ' + busNumber;
        busBadgeEl.hidden = false;
      }

      if (buyer.enabled === false || !buyer.url) {
        renderStatus('empty', name + ' is not available yet',
          'This buyer app is not live right now.\nPlease try another authorised app.');
        return;
      }

      var url = resolveUrl(buyer);
      if (!url) {
        renderStatus('empty', 'Bus number required',
          name + ' needs the bus number from the QR code.\nPlease scan the QR placed on the bus.');
        return;
      }

      // Straight hand-off to the buyer app
      renderStatus('loading', 'Taking you to ' + name + '…', 'Redirecting to the buyer app.');
      location.replace(url);
    }

    function renderOperator(slug, operator) {
      var name = operator.displayName || slug.toUpperCase();
      titleEl.textContent = operator.heroTitle || ('Bus Tickets — ' + name);
      document.title = 'Bus Tickets — ' + name + ' | ONDC';
      subtitleEl.textContent = operator.tagline || operator.description || subtitleEl.textContent;
      setHeroLogo(operator.heroLogo);

      if (busNumber) {
        busBadgeEl.textContent = 'Bus No. ' + busNumber;
        busBadgeEl.hidden = false;
      }

      var buyers = (operator.buyers || []).filter(function (b) {
        if (b.enabled === false || !b.url) return false;
        // Buyers whose link needs a bus number (and have no fallback) are hidden on generic QRs
        if (!resolveUrl(b)) return false;
        return true;
      });

      if (buyers.length === 0) {
        renderStatus('empty', 'No buyer apps available',
          'There are no buyer apps listed for ' + name + ' right now.\nPlease check back soon.');
        return;
      }

      var items = buyers.map(function (b) {
        // Direct hand-off to the buyer app, vid filled into templated links
        var url = resolveUrl(b);
        return '<li class="seller-item">' +
          '<a href="' + escapeAttr(url) + '">' +
          logoHtml(b) +
          '<span class="seller-name">' + escapeHtml(b.name) + '</span>' +
          '<svg class="seller-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>' +
          '</a></li>';
      }).join('');

      mainEl.innerHTML = '<ul class="seller-list">' + items + '</ul>';
      attachLogoFallbacks();
    }

    function renderOperatorList(config, notFound) {
      titleEl.textContent = 'Get Bus Digital Tickets via ONDC';
      subtitleEl.textContent = 'Bus tickets in a jiffy';
      document.title = 'Bus Ticketing | ONDC';
      setHeroLogo('');
      var items = Object.keys(config).map(function (slug) {
        var name = config[slug].displayName || slug.toUpperCase();
        // vid from the QR wins; otherwise the operator's configured default
        var vid = busNumber || config[slug].defaultVid || '';
        var href = '/' + slug + (vid ? '?vid=' + encodeURIComponent(vid) : '');
        return '<li class="seller-item"><a href="' + escapeAttr(href) + '">' +
          logoHtml({ name: name, logo: config[slug].logo || config[slug].heroLogo }) +
          '<span class="seller-name">' + escapeHtml(name) + '</span>' +
          '<svg class="seller-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>' +
          '</a></li>';
      }).join('');
      mainEl.innerHTML = '<ul class="seller-list">' + items + '</ul>';
      attachLogoFallbacks();
    }

    function logoHtml(buyer) {
      if (buyer.logo) {
        return '<img class="seller-logo" src="' + escapeAttr(buyer.logo) + '" alt="" loading="lazy" ' +
          'data-name="' + escapeAttr(buyer.name) + '" />';
      }
      return fallbackLogoHtml(buyer.name);
    }

    // Swap broken logo images for the initial-letter fallback
    function attachLogoFallbacks() {
      mainEl.querySelectorAll('img.seller-logo').forEach(function (img) {
        img.addEventListener('error', function () {
          img.outerHTML = fallbackLogoHtml(img.getAttribute('data-name'));
        });
      });
    }

    function fallbackLogoHtml(name) {
      var initial = (name || '?').trim().charAt(0).toUpperCase();
      return '<span class="seller-logo-fallback">' + escapeHtml(initial) + '</span>';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function escapeAttr(s) {
      return escapeHtml(s);
    }

    function renderStatus(type, title, body) {
      var icons = {
        loading: '<circle cx="12" cy="12" r="9" stroke-opacity=".25"/><path d="M12 3a9 9 0 0 1 9 9"/>',
        error: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
        empty: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/>'
      };
      mainEl.innerHTML =
        '<div class="status-wrap">' +
        '<div class="status-icon ' + type + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        icons[type] +
        '</svg>' +
        '</div>' +
        (title ? '<p class="status-title">' + title + '</p>' : '') +
        '<p class="status-body">' + body + '</p>' +
        '</div>';
    }
  </script>
</body>

</html>
